<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1000, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1000px;
      min-height: 1580px;
      overflow: hidden;
      font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      color: #172019;
      background:
        radial-gradient(circle at 14% 12%, rgba(240, 103, 70, 0.26), transparent 24%),
        radial-gradient(circle at 92% 6%, rgba(64, 151, 108, 0.28), transparent 26%),
        linear-gradient(155deg, #fbf3df 0%, #e3f0d9 56%, #f8d9bd 100%);
    }
    .frame {
      position: relative;
      width: 100%;
      height: 1500px;
      padding: 78px 70px;
    }
    .eyebrow {
      display: inline-flex;
      padding: 14px 22px;
      border: 2px solid rgba(23, 32, 25, 0.15);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      font-size: 27px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 110px 0 0;
      max-width: 780px;
      font-size: 88px;
      line-height: 0.98;
      letter-spacing: -0.06em;
      font-weight: 900;
    }
    h1 span { color: #0b8e63; }
    .prompt {
      margin-top: 70px;
      padding: 42px;
      border-radius: 46px;
      background: #162219;
      color: #fff8df;
      box-shadow: 0 38px 90px rgba(20, 34, 25, 0.25);
    }
    .prompt h2 {
      margin: 0 0 28px;
      font-size: 38px;
      letter-spacing: -0.02em;
    }
    .prompt p {
      margin: 0;
      font-size: 31px;
      line-height: 1.45;
      font-weight: 650;
      color: rgba(255, 248, 223, 0.9);
    }
    .chips {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 190px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .chip {
      padding: 16px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.64);
      border: 2px solid rgba(23, 32, 25, 0.11);
      font-size: 27px;
      font-weight: 800;
    }
    .url {
      position: absolute;
      left: 70px;
      bottom: 118px;
      font-size: 28px;
      font-weight: 800;
      color: rgba(23, 32, 25, 0.6);
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="eyebrow">AI Prompt Pack</div>
    <h1>10 ChatGPT prompts for better <span>product images</span></h1>
    <section class="prompt">
      <h2>Copy-ready formula</h2>
      <p>Subject + scene + style + platform + aspect ratio. Use it for product posters, social covers, thumbnails, and profile visuals.</p>
    </section>
    <section class="chips">
      <div class="chip">Product posters</div>
      <div class="chip">Social covers</div>
      <div class="chip">Thumbnails</div>
      <div class="chip">Instant download</div>
    </section>
    <div class="url">faka.minai.eu.org</div>
  </main>
</body>
</html>
