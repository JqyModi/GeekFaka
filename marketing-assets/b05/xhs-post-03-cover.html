<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1242, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1242px;
      min-height: 1750px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #17201b;
      background:
        radial-gradient(circle at 18% 16%, rgba(250, 120, 70, 0.32), transparent 26%),
        radial-gradient(circle at 84% 12%, rgba(16, 132, 95, 0.28), transparent 26%),
        linear-gradient(145deg, #fff2dc 0%, #f5f0cf 45%, #d9eee3 100%);
    }
    .frame { position: relative; width: 100%; height: 1656px; padding: 88px; }
    .pill {
      display: inline-flex;
      padding: 16px 28px;
      border-radius: 999px;
      background: #17201b;
      color: #fff6df;
      font-size: 34px;
      font-weight: 900;
    }
    h1 {
      margin: 92px 0 0;
      max-width: 940px;
      font-size: 104px;
      line-height: 1.04;
      letter-spacing: -0.06em;
      font-weight: 950;
    }
    h1 span { color: #0a8f63; }
    .sample {
      position: absolute;
      left: 88px;
      right: 88px;
      bottom: 132px;
      display: grid;
      gap: 24px;
    }
    .card {
      padding: 34px 38px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid rgba(23, 32, 27, 0.1);
      box-shadow: 0 26px 70px rgba(45, 82, 62, 0.1);
    }
    .label {
      color: #0a8f63;
      font-size: 34px;
      font-weight: 950;
      margin-bottom: 12px;
    }
    .text {
      font-size: 42px;
      line-height: 1.28;
      font-weight: 850;
    }
    .hint {
      margin-top: 40px;
      max-width: 900px;
      color: rgba(23, 32, 27, 0.68);
      font-size: 40px;
      line-height: 1.42;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="pill">商品图提示词</div>
    <h1>不要只写“高级感”，要写清楚 <span>4 个位置</span></h1>
    <p class="hint">主体、场景、光线、画面留白写清楚，AI 才知道该怎么构图。</p>
    <section class="sample">
      <div class="card">
        <div class="label">低效写法</div>
        <div class="text">帮我生成一张高级感商品图</div>
      </div>
      <div class="card">
        <div class="label">可复用写法</div>
        <div class="text">主体 + 场景 + 光线 + 用途 + 比例 + 留白位置</div>
      </div>
    </section>
  </main>
</body>
</html>
