<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 900px;
      height: 1200px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #15110c;
      background: #0b604c;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 62px;
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 212, 71, .25), transparent 22%),
        radial-gradient(circle at 10% 96%, rgba(240, 65, 45, .28), transparent 28%),
        #0b604c;
    }
    .paper {
      width: 100%;
      height: 100%;
      border: 5px solid #15110c;
      border-radius: 46px;
      background: #fff8eb;
      padding: 52px;
      box-shadow: 18px 18px 0 rgba(21, 17, 12, .72);
    }
    .tag {
      display: inline-block;
      padding: 12px 20px;
      border: 4px solid #15110c;
      border-radius: 999px;
      background: #f04432;
      color: #fff8eb;
      font-size: 30px;
      font-weight: 950;
      box-shadow: 7px 7px 0 #15110c;
    }
    h1 {
      margin: 54px 0 40px;
      font-size: 78px;
      line-height: 1.02;
      letter-spacing: -0.065em;
      font-weight: 950;
    }
    .checklist {
      display: grid;
      gap: 26px;
      margin-top: 54px;
    }
    .item {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 22px;
      align-items: start;
      padding: 28px;
      border: 4px solid #15110c;
      border-radius: 30px;
      background: #fffdf5;
      box-shadow: 8px 8px 0 #15110c;
    }
    .num {
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border-radius: 24px;
      background: #ffd447;
      border: 4px solid #15110c;
      font-size: 36px;
      font-weight: 950;
    }
    .title {
      font-size: 38px;
      line-height: 1.15;
      font-weight: 950;
    }
    .desc {
      margin-top: 10px;
      font-size: 25px;
      line-height: 1.35;
      color: rgba(21, 17, 12, .64);
      font-weight: 760;
    }
    .footer {
      position: absolute;
      left: 114px;
      right: 114px;
      bottom: 106px;
      display: flex;
      justify-content: space-between;
      font-size: 27px;
      color: rgba(21, 17, 12, .65);
      font-weight: 850;
    }
    .brand { color: #0b604c; font-weight: 950; }
  </style>
</head>
<body>
  <main class="frame">
    <section class="paper">
      <div class="tag">能卖出去的资料，都很具体</div>
      <h1>做之前，先过这 3 个问题</h1>
      <div class="checklist">
        <div class="item">
          <div class="num">1</div>
          <div><div class="title">今天就被它折磨</div><div class="desc">不是“未来可能需要”，而是现在就痛。</div></div>
        </div>
        <div class="item">
          <div class="num">2</div>
          <div><div class="title">10 分钟内能开始用</div><div class="desc">买完不是学习，而是直接替换填空。</div></div>
        </div>
        <div class="item">
          <div class="num">3</div>
          <div><div class="title">帮用户少想一步</div><div class="desc">模板的价值，是把选择题变成填空题。</div></div>
        </div>
      </div>
      <div class="footer"><span>收藏这张，选题前先看</span><span class="brand">虾语AI</span></div>
    </section>
  </main>
</body>
</html>
