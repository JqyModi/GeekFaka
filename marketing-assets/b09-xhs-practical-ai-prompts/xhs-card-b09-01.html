<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 900px;
      height: 1200px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #15110c;
      background: #0b604c;
    }
    .frame {
      width: 100%;
      height: 100%;
      padding: 54px 62px;
      background:
        radial-gradient(circle at 90% 8%, rgba(255, 212, 71, .25), transparent 22%),
        radial-gradient(circle at 8% 95%, rgba(239, 67, 49, .28), transparent 26%),
        #0b604c;
    }
    .paper {
      height: 100%;
      border: 5px solid #15110c;
      border-radius: 46px;
      background: #fff8eb;
      padding: 44px 50px 34px;
      box-shadow: 18px 18px 0 rgba(21, 17, 12, .72);
    }
    .tag {
      display: inline-block;
      padding: 12px 20px;
      border: 4px solid #15110c;
      border-radius: 999px;
      background: #f04432;
      color: #fff8eb;
      font-size: 30px;
      font-weight: 950;
      box-shadow: 7px 7px 0 #15110c;
    }
    h1 {
      margin: 42px 0 30px;
      font-size: 72px;
      line-height: 1.02;
      letter-spacing: -0.065em;
      font-weight: 950;
    }
    .list {
      display: grid;
      gap: 14px;
    }
    .item {
      display: grid;
      grid-template-columns: 66px 1fr;
      gap: 20px;
      align-items: center;
      padding: 17px 24px;
      border: 4px solid #15110c;
      border-radius: 26px;
      background: #fffdf5;
      box-shadow: 7px 7px 0 #15110c;
    }
    .num {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      border: 4px solid #15110c;
      border-radius: 22px;
      background: #ffd447;
      font-size: 33px;
      font-weight: 950;
    }
    .title {
      font-size: 35px;
      line-height: 1.16;
      font-weight: 950;
    }
    .desc {
      margin-top: 6px;
      font-size: 22px;
      line-height: 1.25;
      color: rgba(21,17,12,.64);
      font-weight: 760;
    }
    .footer {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      color: rgba(21,17,12,.65);
      font-size: 26px;
      font-weight: 900;
    }
    .brand { color: #0b604c; font-weight: 950; }
  </style>
</head>
<body>
  <main class="frame">
    <section class="paper">
      <div class="tag">直接复制</div>
      <h1>这 5 句提示词<br>先收藏</h1>
      <div class="list">
        <div class="item"><div class="num">1</div><div><div class="title">拒绝借钱不撕破脸</div><div class="desc">委婉版、坚定版、不拉扯版。</div></div></div>
        <div class="item"><div class="num">2</div><div><div class="title">投诉客服说到重点</div><div class="desc">事实、诉求、下一步一次讲清。</div></div></div>
        <div class="item"><div class="num">3</div><div><div class="title">工作汇报不再乱</div><div class="desc">背景、进展、问题、支持。</div></div></div>
        <div class="item"><div class="num">4</div><div><div class="title">简历别写成流水账</div><div class="desc">动作、方法、结果，压成一句话。</div></div></div>
        <div class="item"><div class="num">5</div><div><div class="title">标题别卡在空白页</div><div class="desc">情绪版、干货版、反差版。</div></div></div>
      </div>
      <div class="footer"><span>评论「省心」拿完整版</span><span class="brand">虾语AI</span></div>
    </section>
  </main>
</body>
</html>
