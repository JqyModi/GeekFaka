<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 900px;
      height: 1200px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #14110c;
      background: #fff1dd;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 62px;
      background:
        radial-gradient(circle at 18% 9%, rgba(240, 64, 50, .25), transparent 26%),
        radial-gradient(circle at 90% 10%, rgba(9, 91, 73, .18), transparent 25%),
        linear-gradient(180deg, #fff8eb 0%, #f3dfc0 100%);
    }
    .tag {
      display: inline-flex;
      padding: 14px 24px;
      border: 5px solid #14110c;
      border-radius: 999px;
      background: #ffd447;
      font-size: 34px;
      font-weight: 950;
      box-shadow: 9px 9px 0 #14110c;
    }
    h1 {
      margin: 72px 0 0;
      font-size: 92px;
      line-height: .98;
      letter-spacing: -0.075em;
      font-weight: 950;
    }
    h1 span { color: #ef3f2f; }
    .phone {
      position: absolute;
      right: 72px;
      bottom: 140px;
      width: 310px;
      height: 400px;
      border: 6px solid #14110c;
      border-radius: 46px;
      background: #fffaf0;
      transform: rotate(5deg);
      box-shadow: 15px 15px 0 #14110c;
      padding: 44px 28px;
    }
    .bubble {
      margin-bottom: 28px;
      padding: 18px 20px;
      border: 5px solid #14110c;
      border-radius: 24px;
      font-size: 28px;
      font-weight: 950;
      line-height: 1.1;
    }
    .red { background: #f04432; color: #fffaf0; }
    .green { background: #0b604c; color: #fffaf0; }
    .white { background: #fff; }
    .footer {
      position: absolute;
      left: 62px;
      bottom: 72px;
      padding: 22px 28px;
      border: 5px solid #14110c;
      border-radius: 28px;
      background: #fffaf0;
      font-size: 36px;
      font-weight: 950;
      box-shadow: 9px 9px 0 #14110c;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="tag">收藏备用</div>
    <h1>这 5 句<br>AI 提示词<br>真能<span>少吃亏</span></h1>
    <section class="phone" aria-hidden="true">
      <div class="bubble red">借钱咋拒绝？</div>
      <div class="bubble white">投诉咋说？</div>
      <div class="bubble green">汇报咋写？</div>
    </section>
    <div class="footer">评论「省心」拿完整版</div>
  </main>
</body>
</html>
