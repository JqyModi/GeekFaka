<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 900px;
      height: 383px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #14201a;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 139, 72, 0.34), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(18, 132, 92, 0.28), transparent 28%),
        linear-gradient(140deg, #fff1d8 0%, #edf2d7 48%, #d7eee4 100%);
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 46px 58px;
    }
    .pill {
      display: inline-flex;
      padding: 10px 18px;
      border-radius: 999px;
      background: #14201a;
      color: #fff6df;
      font-size: 22px;
      font-weight: 900;
    }
    h1 {
      margin: 34px 0 0;
      max-width: 660px;
      font-size: 58px;
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 950;
    }
    h1 span { color: #0a8f63; }
    .note {
      position: absolute;
      left: 58px;
      bottom: 38px;
      font-size: 25px;
      line-height: 1.35;
      color: rgba(20, 32, 26, 0.7);
      font-weight: 760;
    }
    .badge {
      position: absolute;
      right: 58px;
      bottom: 44px;
      width: 148px;
      height: 148px;
      border-radius: 38px;
      display: grid;
      place-items: center;
      background: #14201a;
      color: #fff6df;
      font-size: 31px;
      line-height: 1.08;
      text-align: center;
      font-weight: 950;
      box-shadow: 0 22px 60px rgba(20, 32, 26, 0.22);
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="pill">虚拟资料变现</div>
    <h1>用 ChatGPT 做一套<span>可以卖</span>的模板包</h1>
    <div class="note">选题 / 模板 / 自动发货 / 渠道追踪</div>
    <div class="badge">自动<br>交付</div>
  </main>
</body>
</html>
