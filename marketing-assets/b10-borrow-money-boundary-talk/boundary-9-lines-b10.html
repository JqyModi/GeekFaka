<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 900px;
      height: 1200px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #16120c;
      background: #0b604c;
    }
    .frame {
      width: 100%;
      height: 100%;
      padding: 46px;
      background:
        radial-gradient(circle at 8% 5%, rgba(255, 216, 77, .22), transparent 24%),
        radial-gradient(circle at 92% 96%, rgba(231, 65, 50, .26), transparent 26%),
        #0b604c;
    }
    .paper {
      height: 100%;
      padding: 36px 38px 30px;
      border: 5px solid #16120c;
      border-radius: 42px;
      background: #fff8eb;
      box-shadow: 16px 16px 0 rgba(22, 18, 12, .72);
    }
    h1 {
      margin: 0 0 24px;
      font-size: 58px;
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 950;
    }
    .subtitle {
      display: inline-block;
      margin-bottom: 24px;
      padding: 10px 18px;
      border: 4px solid #16120c;
      border-radius: 999px;
      background: #ffd84d;
      font-size: 25px;
      font-weight: 950;
    }
    .group {
      margin-bottom: 15px;
      padding: 16px 18px 15px;
      border: 4px solid #16120c;
      border-radius: 26px;
      background: #fffdf7;
      box-shadow: 6px 6px 0 #16120c;
    }
    .group-title {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #e74132;
      color: #fffaf0;
      font-size: 24px;
      font-weight: 950;
    }
    .group:nth-of-type(2) .group-title { background: #0b604c; }
    .group:nth-of-type(3) .group-title { background: #17130d; }
    .line {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 10px;
      margin: 7px 0;
      font-size: 24px;
      line-height: 1.22;
      font-weight: 850;
    }
    .num {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #f0dfc7;
      font-size: 19px;
      font-weight: 950;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      color: rgba(22, 18, 12, .64);
      font-size: 24px;
      font-weight: 900;
    }
    .brand { color: #0b604c; font-weight: 950; }
  </style>
</head>
<body>
  <main class="frame">
    <section class="paper">
      <h1>别人借钱时<br>照着这 9 句话回</h1>
      <div class="subtitle">不撕破脸，也不委屈自己</div>

      <div class="group">
        <div class="group-title">想委婉一点</div>
        <div class="line"><span class="num">1</span><span>最近资金安排也比较紧，暂时帮不上你，希望你理解。</span></div>
        <div class="line"><span class="num">2</span><span>钱这块我确实不方便借出去，但可以帮你想别的办法。</span></div>
        <div class="line"><span class="num">3</span><span>我知道你现在不容易，但我这边也有固定开销。</span></div>
      </div>

      <div class="group">
        <div class="group-title">对方继续追问</div>
        <div class="line"><span class="num">4</span><span>不是金额的问题，是我现在不想再把钱借出去。</span></div>
        <div class="line"><span class="num">5</span><span>我理解你着急，但这个决定没办法改变。</span></div>
        <div class="line"><span class="num">6</span><span>勉强答应后关系可能更尴尬，所以我直接说清楚。</span></div>
      </div>

      <div class="group">
        <div class="group-title">结束拉扯</div>
        <div class="line"><span class="num">7</span><span>借钱这件事我不会答应，我们先不再讨论这个了。</span></div>
        <div class="line"><span class="num">8</span><span>我可以帮你想分期或延期办法，但直接借钱不行。</span></div>
        <div class="line"><span class="num">9</span><span>我珍惜关系，所以更想提前把边界说清楚。</span></div>
      </div>

      <div class="footer"><span>评论「借钱」拿 30 句完整版</span><span class="brand">虾语AI</span></div>
    </section>
  </main>
</body>
</html>
