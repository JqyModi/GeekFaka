<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 900px;
      height: 1200px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #17130d;
      background: #fff6e8;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 58px;
      background:
        linear-gradient(90deg, rgba(23,19,13,.06) 1px, transparent 1px),
        linear-gradient(180deg, rgba(23,19,13,.06) 1px, transparent 1px),
        #fff6e8;
      background-size: 42px 42px;
    }
    h1 {
      margin: 0;
      font-size: 74px;
      line-height: .98;
      letter-spacing: -0.06em;
      font-weight: 950;
    }
    .tip {
      margin: 28px 0 42px;
      display: inline-block;
      padding: 13px 22px;
      border: 5px solid #17130d;
      border-radius: 999px;
      background: #ffd84d;
      box-shadow: 8px 8px 0 #17130d;
      font-size: 30px;
      font-weight: 950;
    }
    .cards {
      display: grid;
      gap: 28px;
    }
    .card {
      padding: 32px;
      border: 5px solid #17130d;
      border-radius: 36px;
      background: #fffdf7;
      box-shadow: 10px 10px 0 #17130d;
    }
    .card:nth-child(2) { background: #0b604c; color: #fffaf0; }
    .card:nth-child(3) { background: #e74132; color: #fffaf0; }
    .label {
      font-size: 32px;
      font-weight: 950;
    }
    .body {
      margin-top: 12px;
      font-size: 38px;
      line-height: 1.13;
      font-weight: 950;
      letter-spacing: -0.035em;
    }
    .small {
      margin-top: 14px;
      font-size: 25px;
      line-height: 1.3;
      font-weight: 760;
      opacity: .76;
    }
    .footer {
      position: absolute;
      left: 58px;
      right: 58px;
      bottom: 54px;
      padding: 18px 24px;
      border: 5px solid #17130d;
      border-radius: 999px;
      background: #fffdf7;
      text-align: center;
      font-size: 28px;
      font-weight: 950;
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>拒绝借钱<br>最怕这 3 件事</h1>
    <div class="tip">不是狠，是稳</div>
    <section class="cards">
      <div class="card">
        <div class="label">01 先说结论</div>
        <div class="body">不要绕半天，越绕越像还有机会。</div>
        <div class="small">可以温和，但不要含糊。</div>
      </div>
      <div class="card">
        <div class="label">02 不编理由</div>
        <div class="body">理由越多，对方越容易找漏洞。</div>
        <div class="small">“我不方便借出去”本身就是完整理由。</div>
      </div>
      <div class="card">
        <div class="label">03 不进拉扯</div>
        <div class="body">第二轮回复要更短，不要越解释越累。</div>
        <div class="small">重复边界，而不是重复证明自己。</div>
      </div>
    </section>
    <div class="footer">评论「借钱」拿 30 句完整版</div>
  </main>
</body>
</html>
