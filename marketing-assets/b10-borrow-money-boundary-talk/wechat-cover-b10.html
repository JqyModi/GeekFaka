<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 900px;
      height: 383px;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #17130d;
      background: #fff4e3;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 38px 46px;
      background:
        radial-gradient(circle at 90% 18%, rgba(231, 65, 50, .30), transparent 24%),
        linear-gradient(135deg, #fff8e8 0%, #eed8b9 100%);
    }
    .tag {
      display: inline-block;
      padding: 9px 18px;
      border: 4px solid #17130d;
      border-radius: 999px;
      background: #ffd84d;
      box-shadow: 6px 6px 0 #17130d;
      font-size: 27px;
      font-weight: 950;
    }
    h1 {
      margin: 24px 0 0;
      font-size: 62px;
      line-height: .98;
      letter-spacing: -0.055em;
      font-weight: 950;
    }
    .red { color: #e74132; }
    .bubble {
      position: absolute;
      right: 42px;
      bottom: 34px;
      width: 278px;
      padding: 22px 20px;
      border: 5px solid #17130d;
      border-radius: 30px;
      background: #0b604c;
      color: #fffaf0;
      box-shadow: 9px 9px 0 #17130d;
      transform: rotate(3deg);
      font-size: 33px;
      line-height: 1.05;
      font-weight: 950;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="tag">收藏备用</div>
    <h1>别人借钱时<br>照着这 <span class="red">9 句</span> 回</h1>
    <div class="bubble">不撕破脸<br>也不委屈自己</div>
  </main>
</body>
</html>
