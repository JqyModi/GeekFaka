services:
  geekfaka:
    container_name: geekfaka-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: geekfaka-mysql
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
